<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Loading Screenz</title>
  <!-- The Power Core logo mark, shown by .lz-logo-orb. The flat icon in assets/icons/ is its favicon partner. -->
  <!-- The animation lives in the SVG so it still plays when the file is used as a CSS background image. -->
  <style>
    .spin {
      transform-origin: 64px 64px;
      animation: spin 2.4s steps(12) infinite;
    }
    .pulse {
      transform-origin: 64px 64px;
      animation: pulse 2.4s ease-in-out infinite alternate;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      from { opacity: 0.6; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .spin, .pulse { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#e2e5e2"/>
      <stop offset="0.55" stop-color="#9da39f"/>
      <stop offset="0.62" stop-color="#b9beba"/>
      <stop offset="1" stop-color="#eef0ee"/>
    </linearGradient>
    <radialGradient id="glass">
      <stop offset="0" stop-color="#24520d"/>
      <stop offset="0.55" stop-color="#0c1d05"/>
      <stop offset="1" stop-color="#030602"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#d8ff8a"/>
      <stop offset="0.45" stop-color="#8cc63f"/>
      <stop offset="0.8" stop-color="#3f7a12"/>
      <stop offset="1" stop-color="#173006"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#b8ff4a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#b8ff4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="segment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ffd0"/>
      <stop offset="1" stop-color="#8cc63f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Chrome bezel around tinted glass -->
  <circle cx="64" cy="64" r="60" fill="url(#chrome)" stroke="#5f6561" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="51" fill="#1d201e"/>
  <circle cx="64" cy="64" r="49" fill="url(#glass)"/>

  <!-- Twelve loading segments, brightest at 12 o'clock and fading counterclockwise -->
  <g class="spin" filter="url(#glow)" fill="url(#segment)">
    <rect x="60.5" y="20" width="7" height="13" rx="3.5" transform="rotate(0 64 64)" opacity="1"/>
    <rect x="60.5" y="20" width="7" height="13" rx="3.5" transform="rotate(330 64 64)" opacity="0.925"/>
    <rect x="60.5" y="20" width="7" height="13" rx="3.5" transform="rotate(300 64 64)" opacity="0.85"/>
    <rect x="60.5" y="20" width="7" height="13" rx="3.5" transform="rotate(270 64 64)" opacity="0.775"/>
    <rect x="60.5" y="20" width="7" height="13" rx="3.5" transform="rotate(240 64 64)" opacity="0.7"/>
    <rect x="60.5" y="20" width="7" height="13" rx="3.5" transform="rotate(210 64 64)" opacity="0.625"/>
    <rect x="60.5" y="20" width="7" height="13" rx="3.5" transform="rotate(180 64 64)" opacity="0.55"/>
    <rect x="60.5" y="20" width="7" height="13" rx="3.5" transform="rotate(150 64 64)" opacity="0.475"/>
    <rect x="60.5" y="20" width="7" height="13" rx="3.5" transform="rotate(120 64 64)" opacity="0.4"/>
    <rect x="60.5" y="20" width="7" height="13" rx="3.5" transform="rotate(90 64 64)" opacity="0.325"/>
    <rect x="60.5" y="20" width="7" height="13" rx="3.5" transform="rotate(60 64 64)" opacity="0.25"/>
    <rect x="60.5" y="20" width="7" height="13" rx="3.5" transform="rotate(30 64 64)" opacity="0.175"/>
  </g>

  <!-- Gel core -->
  <circle class="pulse" cx="64" cy="64" r="30" fill="url(#halo)"/>
  <circle cx="64" cy="64" r="18" fill="url(#orb)"/>
  <ellipse cx="58" cy="57" rx="6" ry="3.5" fill="#fff" opacity="0.85"/>

  <!-- Glass shine and rim light -->
  <ellipse cx="64" cy="40" rx="36" ry="22" fill="url(#shine)" opacity="0.5"/>
  <path d="M28 86 A44 44 0 0 0 100 86" fill="none" stroke="#c4f060" stroke-width="2" opacity="0.35"/>
</svg>
